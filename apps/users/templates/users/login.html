{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center py-12">
  <form method="POST" class="w-full max-w-md">
    {% csrf_token %}
    <div class="bg-base-200 border border-base-300 rounded-lg p-8 shadow-md">
      <h2 class="text-2xl md:text-3xl font-semibold text-center mb-6">Login</h2>

      <div class="mb-4">
        <label class="label text-sm text-base-content/70">{{ form.email.label }}</label>
        {{ form.email }}
      </div>

      <div class="mb-4">
        <label class="label text-sm text-base-content/70">{{ form.password.label }}</label>
        {{ form.password }}
      </div>

      <button class="btn btn-neutral w-full py-3 mt-4 text-lg">Login</button>
    </div>
  </form>
</div>
{% endblock %}
