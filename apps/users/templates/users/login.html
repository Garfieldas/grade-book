{% extends "base.html" %}
{% block content %}
{% if not user.is_authenticated %}
<div class="flex items-center justify-center py-12">
  <form method="POST" class="w-full max-w-md">
    {% csrf_token %}
    <div class="bg-base-200 border border-base-300 rounded-lg p-8 shadow-md">
      <h2 class="text-2xl md:text-3xl font-semibold text-center mb-6">Login</h2>

      <div class="mb-4">
        <label class="label text-sm text-base-content/70">{{ form.email.label }}</label>
        {{ form.email }}
      </div>

      <div class="mb-4">
        <label class="label text-sm text-base-content/70">{{ form.password.label }}</label>
        {{ form.password }}
      </div>

      <button class="btn btn-neutral w-full py-3 mt-4 text-lg">Login</button>
  {% if messages %}
    {% for message in messages %}
        <div role="alert" class="alert alert-error mt-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
          <span>{{ message }}</span>
        </div>
    {% endfor %}
  {% endif %}
</div>
    </div>
  </form>
{% endif %}
{% endblock %}
