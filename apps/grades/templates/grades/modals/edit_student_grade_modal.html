<div #id="modal-container">
<input type="checkbox" id="edit-grade-modal-toggle" class="modal-toggle" checked />
<div id="edit-grade-modal" class="modal modal-open" role="dialog">
  <div class="modal-box">
    <form method="dialog">
      <label for="edit-grade-modal-toggle" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" onclick="document.getElementById('edit-grade-modal').remove()">✕</label>
    </form>
    
    <h3 class="font-bold text-lg text-center mb-4">Redaguoti pažymį</h3>
    
     {% if messages %}
        <div class="mb-4">
          {% for message in messages %}
            {% if message.tags == 'error' %}
              <div role="alert" class="alert alert-error mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ message }}</span>
              </div>
            {% endif %}
          {% endfor %}
        </div>
      {% endif %}
    
<form id="edit-mark-form"
      method="POST"
      hx-post="{% url 'edit_mark' mark.id %}"
      hx-target="#modal-container"
      hx-swap="outerHTML">
  {% csrf_token %}
  <div class="space-y-4">
    <div>
      <label for="id_mark_date" class="block text-sm font-medium mb-2">{{ form.mark_date.label }}</label>
      {{ form.mark_date }}
    </div>
    <div>
      <label for="id_value" class="block text-sm font-medium mb-2">{{ form.value.label }}</label>
      {{ form.value }}
    </div>
  </div>
  <div class="modal-action">
    <button type="submit" class="btn btn-primary w-full">Išsaugoti</button>
  </div>
</form>
  </div>
  <label class="modal-backdrop" for="edit-grade-modal-toggle" onclick="document.getElementById('edit-grade-modal').remove()">Close</label>
</div>
</div>
