<main class="flex-1 min-w-0 p-5" id="userDashboard">
<section id="latest-marks" class="mx-auto">
  <div class="flex items-center gap-2 mb-4">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <h2 class="text-base font-semibold">Šiandienos pažymiai</h2>
    <span class="badge badge-sm">{{ grades|length }}</span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for grade in grades %}
    <div class="card bg-base-200 shadow-sm hover:shadow-md transition">
      <div class="card-body">
        <div class="flex items-center justify-between">
          <div class="flex flex-col">
            <h3 class="font-semibold text-lg">{{ grade.subject.name }}</h3>
            <p class="text-sm opacity-70">
              {{ grade.subject.teacher }}
            </p>
          </div>
          <div class="w-12 h-12 rounded-full bg-primary text-primary-content flex items-center justify-center text-xl font-bold">
            {{ grade.value }}
          </div>
        </div>
        <p class="text-xs mt-2 opacity-60">
          {{ grade.mark_date|date:"Y-m-d" }}
        </p>
      </div>
    </div>
    {% empty %}
      <p class="opacity-50">Šiandien negavote jokių pažymių</p>
    {% endfor %}
  </div>
</section>
</main>
