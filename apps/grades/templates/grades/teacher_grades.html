<main class="flex-1 min-w-0 p-5" id="userDashboard">
  <div id="messages" class="mb-4">
    {% include 'grades/notifications/alert.html' %}
  </div>

  <section class="mx-auto">
    <div class="flex items-center gap-2 mb-4">
      <i data-lucide="clipboard-list" class="w-5 h-5"></i>
      <h2 class="text-base font-semibold">Pažymiai – {{ student }}</h2>
      <span class="badge badge-sm">{{ marks|length }}</span>
    </div>

    <div class="card bg-base-200 shadow-sm">
      <div class="overflow-x-auto rounded-t-box">
        <table class="table table-zebra w-full">
          <thead class="bg-base-300 sticky top-0">
            <tr>
              <th class="w-12">#</th>
              <th>Data</th>
              <th>Pažymys</th>
              <th>Veiksmai</th>
            </tr>
          </thead>
          <tbody>
            {% for mark in marks %}
            <tr>
              <th>{{ forloop.counter }}</th>
              <td>{{ mark.mark_date|date:"Y-m-d" }}</td>
              <td><span class="badge badge-outline">{{ mark.value }}</span></td>
              <td>
                <div class="flex gap-2">
                  <button class="btn btn-warning btn-xs"
                    hx-trigger="click"
                    hx-target="#modal-container"
                    hx-swap="innerHTML">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>
                  <button class="btn btn-error btn-xs"
                    hx-trigger="click"
                    hx-target="#userDashboard"
                    hx-swap="outerHTML"
                    hx-confirm="Ar tikrai norite ištrinti šį pažymį?">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="4" class="text-center opacity-50 py-6">
                Nėra pažymių šiam mokiniui.
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>
