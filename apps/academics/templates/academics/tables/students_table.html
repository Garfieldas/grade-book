<main class="flex-1 min-w-0 p-5" id="userDashboard">
    <div id="messages" class="mb-4" hx-swap-obb="true">
      {% include 'grades/notifications/alert.html' %}
    </div>
  <section id="teachers" class="mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex items-center gap-2">
        <i data-lucide="users" class="w-5 h-5"></i>
        <h2 class="text-base font-semibold">Mokiniai</h2>
        <span class="badge badge-sm"></span>
      </div>
    </div>
    <div class="card bg-base-200 shadow-sm">
      <div class="overflow-x-auto rounded-t-box">
        <table class="table table-zebra w-full">
          <thead class="bg-base-300 sticky top-0">
            <tr>
              <th class="w-12">#</th>
              <th>Vardas</th>
              <th>Pavardė</th>
              <th>El.paštas</th>
              <th>Klasė</th>
              <th>Veiksmai</th>
            </tr>
          </thead>
          <tbody>
            {% for item in students_list %}
            <tr>
              <th>{{ forloop.counter }}</th>
              <td class="font-medium">{{ item.first_name}}</td>
              <td><a class="link">{{ item.last_name}}</a></td>
              <td><a class="link">{{ item.email}}</a></td>
               <td>
                  <span class="badge badge-outline">{{ item.student_class }}</span>
              </td>
              <td>
              <div class="join justify-center">
                <button class="btn btn-primary btn-xs join-item add-mark-btn"
                hx-get= "{% url 'add_mark_by_id' item.id %}"
                hx-trigger="click"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                >
                <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
              </div>
                </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
  </section>
<div id="modal-container">
</div>
</main>
