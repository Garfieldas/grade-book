<div class="card bg-base-200 shadow-sm">
  <div class="overflow-x-auto rounded-t-box">
    <table class="table table-zebra w-full">
      <thead class="bg-base-300 sticky top-0">
        <tr>
          <th class="w-12">#</th>
          <th>Mokytoja</th>
          <th>Dalykas</th>
          <th>Pradžia</th>
          <th>Pabaiga</th>
        </tr>
      </thead>
      <tbody>
        {% for lesson in student_lessons %}
        <tr>
          <th>{{ forloop.counter }}</th>
          <td class="font-medium">{{ lesson.subject.teacher.full_name }}</td>
          <td>
            <span class="badge badge-outline">{{ lesson.subject }}</span>
          </td>
          <td><a class="link">{{ lesson.start_date }}</a></td>
          <td><a class="link">{{ lesson.end_date }}</a></td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="p-3 flex flex-col sm:flex-row items-center justify-between gap-3">
    <p class="text-sm text-base-content/60">Rodoma 1–3 of 3</p>
    <div class="join">
      <button class="btn btn-sm join-item" disabled>
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
        Ankstesnis
      </button>
      <button class="btn btn-sm join-item btn-active">1</button>
      <button class="btn btn-sm join-item" disabled>2</button>
      <button class="btn btn-sm join-item" disabled>3</button>
      <button class="btn btn-sm join-item" disabled>
        Kitas
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>
</div>
