<dialog id="theme-modal" class="modal">
  <div class="modal-box">
    <h3 class="font-semibold mb-2">Pasirinkite temą</h3>
    <label class="text-sm text-base-content/60">Tema</label>
    <select id="theme-select" class="select select-bordered w-full mt-1">
      <option value="light">light</option>
      <option value="dark">dark</option>
      <option value="retro">retro</option>
    </select>
    <div class="modal-action">
      <button id="close-theme-modal" class="btn btn-ghost">Uždaryti</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

if (window.lucide && lucide.createIcons) {
  lucide.createIcons();
}
(function applyStoredTheme() {
  try {
    const stored = localStorage.getItem('theme');
    const theme = stored || document.documentElement.getAttribute('data-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (_) {}
})();
const openBtn = document.getElementById('open-theme-settings');
const modal = document.getElementById('theme-modal');
const select = document.getElementById('theme-select');
const closeBtn = document.getElementById('close-theme-modal');

if (openBtn && modal && select) {
  openBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    select.value = current;
    if (typeof modal.showModal === 'function') {
      modal.showModal();
    } else {
      modal.setAttribute('open', '');
    }
  });

  select.addEventListener('change', () => {
    const value = select.value;
    document.documentElement.setAttribute('data-theme', value);
    try {
      localStorage.setItem('theme', value);
    } catch (_) {}
  });

  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      if (typeof modal.close === 'function') {
        modal.close();
      } else {
        modal.removeAttribute('open');
      }
    });
  }
}
</script>
