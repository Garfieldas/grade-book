{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}School Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.js" integrity="sha384-ezjq8118wdwdRMj+nX4bevEi+cDLTbhLAeFF688VK8tPDGeLUe0WoY2MZtSla72F" crossorigin="anonymous"></script>
    {% block head_extra %}{% endblock %}
  </head>
<body>
  <div class="drawer lg:drawer-open">
    <input id="nav-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content min-h-screen bg-base-100 flex flex-col">
      {% include 'partials/header.html' %}
      <main class="flex-1 min-w-0 p-5">
        {% block content %}
        {% endblock %}
      </main>
      {% include 'partials/footer.html' %}
    </div>
      {% block navbar %}
      {% endblock %}
  </div>

  {% include 'partials/themepicker.html' %}

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        if (window.lucide && typeof lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {
        console.warn('lucide init failed', e);
      }
      var y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();
    });
  htmx.onLoad(function(target) {
    const handleAlert = (alert) => {
        setTimeout(() => {
            alert.classList.add("opacity-0", "transition", "duration-700");
            setTimeout(() => alert.remove(), 700);
        }, 3000);
    };
    if (target.classList.contains("autoremove")) {
        handleAlert(target);
    }
    const alerts = target.querySelectorAll(".autoremove");
    alerts.forEach(handleAlert);
});
  </script>
</body>
</html>
